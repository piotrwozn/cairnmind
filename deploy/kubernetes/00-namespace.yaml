# The namespace of the ArcadeDB server of docs/DEPLOYMENT.md ("Kubernetes"). Its pods must meet the
# "restricted" Pod Security Standard: the server runs as uid 10001 with no capabilities.
apiVersion: v1
kind: Namespace
metadata:
  name: cairnmind-db
  labels:
    app.kubernetes.io/part-of: cairnmind
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
