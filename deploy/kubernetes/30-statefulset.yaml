# One ArcadeDB server of the release Cairnmind pins, built from deploy/arcadedb (the image is not
# published: build it and load or push it where the cluster can pull it, then change `image`).
# What to change is listed in docs/DEPLOYMENT.md, "Kubernetes".
#
# TLS ends at the server itself: ArcadeDB 26.11.1 has its own HTTPS listener (arcadedb.ssl.*), so
# no proxy is needed. It listens on 2490 with the key and certificate of the Secret arcadedb-tls.
# The plain HTTP listener cannot be turned off and listens on the same addresses; it is used only by
# the probes, from inside the pod, and neither the Service nor the NetworkPolicy lets anything else
# reach it.
#
# Needs the Secrets arcadedb-root-password and arcadedb-tls in this namespace before the pod can
# start (templates/secrets.yaml shows their shape; docs/DEPLOYMENT.md shows how to create them).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: arcadedb
  namespace: cairnmind-db
  labels:
    app.kubernetes.io/name: arcadedb
    app.kubernetes.io/part-of: cairnmind
spec:
  serviceName: arcadedb
  # ArcadeDB here is one server; more replicas would be separate servers on separate volumes.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arcadedb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arcadedb
        app.kubernetes.io/part-of: cairnmind
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The JVM gets SIGTERM and closes its databases; give it time before SIGKILL (as in compose.yaml).
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The volume and the mounted Secrets get group 10001, so the server can use them.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: arcadedb
          image: cairnmind-arcadedb:local
          imagePullPolicy: IfNotPresent
          env:
            - name: ARCADEDB_ROOT_PASSWORD_FILE
              value: /run/secrets/arcadedb-root/password
            - name: ARCADEDB_HTTP_PORT
              value: "2480"
            - name: ARCADEDB_TLS_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arcadedb-tls
                  key: store-password
            # Split into words by the entrypoint: no value here may contain a space. The store password
            # is visible in the server's command line inside the pod, to whoever may read this Secret.
            - name: ARCADEDB_JAVA_OPTS
              value: >-
                -Darcadedb.ssl.enabled=true
                -Darcadedb.server.httpsIncomingPort=2490
                -Darcadedb.ssl.keyStore=/run/secrets/arcadedb-tls/keystore.p12
                -Darcadedb.ssl.keyStorePassword=$(ARCADEDB_TLS_STORE_PASSWORD)
                -Darcadedb.ssl.trustStore=/run/secrets/arcadedb-tls/keystore.p12
                -Darcadedb.ssl.trustStorePassword=$(ARCADEDB_TLS_STORE_PASSWORD)
          ports:
            - name: https
              containerPort: 2490
              protocol: TCP
          # The image's own health check, GET /api/v1/ready on the pod's loopback.
          startupProbe:
            exec:
              command: ["/opt/arcadedb/healthcheck.sh"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["/opt/arcadedb/healthcheck.sh"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/opt/arcadedb/healthcheck.sh"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            # The default heap is 1 GB (-Xmx1024m); raise the memory with it.
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/arcadedb
            - name: root-password
              mountPath: /run/secrets/arcadedb-root
              readOnly: true
            - name: tls
              mountPath: /run/secrets/arcadedb-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Read by the server as uid 10001 through the group fsGroup gives it: owner root, group 10001.
        - name: root-password
          secret:
            secretName: arcadedb-root-password
            defaultMode: 0440
        - name: tls
          secret:
            secretName: arcadedb-tls
            defaultMode: 0440
        # The entrypoint's copy of the root password and the JVM's temporary files: in memory only.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: arcadedb
          app.kubernetes.io/part-of: cairnmind
      spec:
        accessModes: ["ReadWriteOnce"]
        # The cluster's default storage class unless you name one: storageClassName: ...
        resources:
          requests:
            storage: 10Gi
