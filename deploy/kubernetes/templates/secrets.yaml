# The shape of the Secrets the server and its clients need. A template only: every value is empty and
# none may ever be written here or committed. Create the real ones with `kubectl create secret` from
# files, as docs/DEPLOYMENT.md ("Kubernetes") shows. `kubectl apply -f deploy/kubernetes` does not read
# this folder, so it cannot replace a real Secret with these empty ones.
#
# The root password of the server: read once, on the first start, when ArcadeDB creates root.
apiVersion: v1
kind: Secret
metadata:
  name: arcadedb-root-password
  namespace: cairnmind-db
type: Opaque
stringData:
  password: ""
---
# The server's TLS key and certificate as one PKCS#12 store, and the password of that store
# (letters and digits only: it is passed to the JVM on its command line).
apiVersion: v1
kind: Secret
metadata:
  name: arcadedb-tls
  namespace: cairnmind-db
type: Opaque
stringData:
  store-password: ""
data:
  keystore.p12: ""
---
# For a pod that runs Cairnmind, in that pod's namespace: the password of its dedicated database user
# (cairnmind db create-user). Mounted as a volume with defaultMode 0400, Cairnmind reads it with
# arcade_password_file when it runs as the file's owner (docs/DEPLOYMENT.md, "Kubernetes").
apiVersion: v1
kind: Secret
metadata:
  name: cairnmind-db-user
  namespace: cairnmind-db
type: Opaque
stringData:
  password: ""
