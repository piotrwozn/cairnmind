[project]
name = "cairnmind"
version = "0.9.0"
description = "Evidence-grounded project memory for coding agents, in your terminal (formerly DevBrain)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Piotr Woźnicki" }]
keywords = ["coding-agents", "memory", "rag", "mcp", "claude-code", "codex", "ollama", "terminal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=15,<16", "httpx>=0.28,<1",
  "typer>=0.15,<1", "textual>=8,<9", "mcp>=1.9,<2",
  "pathspec>=0.12,<1",
  "tomlkit>=0.13,<1",
  "jsonschema>=4,<5",
  "github-copilot-sdk==1.0.29",
  "tree-sitter>=0.24,<0.26", "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26", "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-xdist>=3.6,<4", "pytest-cov>=7,<8",
       "coverage>=7.10,<8", "diff-cover>=9,<11", "ruff>=0.11,<1"]

[project.urls]
Homepage = "https://github.com/piotrwozn/cairnmind"
Issues = "https://github.com/piotrwozn/cairnmind/issues"
Changelog = "https://github.com/piotrwozn/cairnmind/blob/main/CHANGELOG.md"

[project.scripts]
cairnmind = "cairnmind.cli:entrypoint"
# Transitional alias for installations and scripts that still call devbrain.
devbrain = "cairnmind.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/devbrain is the import alias of the earlier module name, kept for one release.
packages = ["src/cairnmind", "src/devbrain"]

[tool.hatch.build]
exclude = ["node_modules", "frontend/dist", "frontend/test-results", "frontend/playwright-report", ".pytest_cache", ".ruff_cache", "__pycache__"]

[tool.pytest.ini_options]
junit_family = "xunit1"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # Raised on import by FastAPI's test client, not by this code; removing it is issue #61.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

# Coverage is off unless asked for: `uv run pytest -n 4 --cov --cov-report=xml` (see CONTRIBUTING.md).
[tool.coverage.run]
source = ["src/cairnmind"]
branch = true
relative_files = true
# Also measure the Python processes the tests start (python -m cairnmind, workers, bridges).
# A process ended by a signal, such as a pane killed with its tmux server, saves nothing.
patch = ["subprocess"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
