[project]
name = "cairnmind"
version = "0.12.0"
description = "Verified project memory for coding agents: every answer cites a checked source"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Piotr Woźnicki" }]
keywords = ["coding-agents", "memory", "rag", "mcp", "claude-code", "codex", "ollama", "terminal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=15,<16", "httpx>=0.28,<1",
  "typer>=0.15,<1", "textual>=8,<9", "mcp>=1.9,<2",
  "pathspec>=0.12,<1",
  "tomlkit>=0.13,<1",
  "jsonschema>=4,<5",
  "tree-sitter>=0.24,<0.26", "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26", "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
copilot = ["github-copilot-sdk==1.0.29"]
nli = ["onnxruntime>=1.19,<2", "tokenizers>=0.20,<1"]
vec = ["sqlite-vec>=0.1.6,<1"]
all = ["github-copilot-sdk==1.0.29", "onnxruntime>=1.19,<2", "tokenizers>=0.20,<1", "sqlite-vec>=0.1.6,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-xdist>=3.6,<4", "pytest-cov>=7,<8",
       "coverage>=7.10,<8", "diff-cover>=9.3.2,<11", "ruff>=0.11,<1", "pyright>=1.1.390,<2",
       "github-copilot-sdk==1.0.29",
       # The test client of FastAPI/Starlette; plain httpx with it is deprecated (#61).
       "httpx2>=2,<3"]

[project.urls]
Homepage = "https://github.com/piotrwozn/cairnmind"
Issues = "https://github.com/piotrwozn/cairnmind/issues"
Changelog = "https://github.com/piotrwozn/cairnmind/blob/main/CHANGELOG.md"

[project.scripts]
cairnmind = "cairnmind.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairnmind"]

[tool.hatch.build.targets.wheel.force-include]
# The files of the engine image, for `cairnmind engine start --docker --build` (#272).
"deploy/arcadedb" = "cairnmind/arcadedb_image"
# Bundled sample project for zero-setup `uvx cairnmind try` (ADR-06).
"examples/sample-project" = "cairnmind/sample_project"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
exclude = ["node_modules", "ui/node_modules", ".pytest_cache", ".ruff_cache", "__pycache__"]

[tool.pytest.ini_options]
junit_family = "xunit1"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# Coverage is off unless asked for: `uv run pytest -n 4 --cov --cov-report=xml` (see CONTRIBUTING.md).
[tool.coverage.run]
source = ["src/cairnmind"]
branch = true
relative_files = true
# Also measure the Python processes the tests start (python -m cairnmind, workers, bridges).
# A process ended by a signal, such as a pane killed with its tmux server, saves nothing.
patch = ["subprocess"]

[tool.coverage.paths]
source = [
    "src/cairnmind",
    "*/src/cairnmind",
    "*\\src\\cairnmind",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S", "UP", "SIM", "I", "ASYNC"]
# S603/S607 flag every subprocess.run/Popen with non-literal argv or PATH lookup (`git`, `docker`, `tmux`, `java`);
# shell=True (S602) and shell injection vectors (S604, S605) remain strictly enforced across the entire codebase.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Sealed storage-layer query builders validate every collection/column name via quote_name/_arcade_ident/validate_field_path.
"src/cairnmind/storage/*.py" = ["S608"]
"tests/**/*.py" = [
  "S101", "S104", "S105", "S106", "S107", "S108", "S110", "S311", "S314", "S606", "S608",
  "B017", "B023",
  "ASYNC109", "ASYNC110", "ASYNC220", "ASYNC221", "ASYNC240",
]
"hatch_build.py" = ["S603", "S607"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src/cairnmind"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
executionEnvironments = [
  { root = "src/cairnmind/pal", reportOptionalMemberAccess = "error", reportOptionalSubscript = "error" },
  { root = "src/cairnmind/storage", reportOptionalMemberAccess = "error", reportOptionalSubscript = "error" },
  { root = "src/cairnmind/ui", reportOptionalMemberAccess = "error", reportOptionalSubscript = "error" },
  { root = "src/cairnmind/mcp", reportOptionalMemberAccess = "error", reportOptionalSubscript = "error" },
]
