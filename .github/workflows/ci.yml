name: CI

on:
  # Branches are checked through their pull request; a push runs CI only on main,
  # so a commit on a pull request branch does not run every job twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same pull request cancels the run of the older one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: devbrain

env:
  # Shared 2-core runners: keyboard latency budgets x4 (still below the 3 s blocked-UI case).
  DEVBRAIN_LATENCY_SCALE: "4"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests

  fast-tests:
    # Modules that need neither ArcadeDB/Java nor a real tmux server.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - run: uv run pytest -m "not arcade and not tmux" -q

  full-tests:
    # Real pinned ArcadeDB on Java 21 plus tmux, as on the target WSL host.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/devbrain-arcade
          key: arcadedb-${{ hashFiles('devbrain/src/devbrain/config.py') }}
      - name: Prepare pinned ArcadeDB
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from devbrain.config import Settings
          from devbrain.engine import install_engine
          settings = Settings.load(Path.home() / ".cache/devbrain-arcade", create=True)
          path = install_engine(settings)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"DEVBRAIN_ARCADE_DIST={path}\n")
          PY
      - run: uv run pytest -q
