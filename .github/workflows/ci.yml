name: CI

on:
  # Branches are checked through their pull request; a push runs CI only on main,
  # so a commit on a pull request branch does not run every job twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository; coverage-badge below is the one exception.
permissions:
  contents: read

# A newer commit on the same pull request cancels the run of the older one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Shared runners whose every core runs a test process: keyboard latency budgets x4 (still below
  # the 3 s blocked-UI case).
  CAIRNMIND_LATENCY_SCALE: "4"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests

  fast-tests:
    # Modules that need neither ArcadeDB/Java nor a real tmux server.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - run: uv run pytest -n 4 -m "not arcade and not tmux" -q

  macos-fast-tests:
    # The same fast tier on an Apple silicon runner (macos-15 is arm64). macOS is supported since 0.12.0
    # (#237), so a failure here fails the workflow like the Linux tiers; the timeout stops a hang from
    # burning runner minutes. The pytest output and the JUnit XML are kept as an artifact.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      # The hosted macOS runner has 3 cores. Every test has its own time limit (tests/run_guard.py,
      # 300 s by default); the step stops five minutes before the job so the report below is still kept.
      - name: Fast tier
        shell: bash
        timeout-minutes: 25
        run: |
          set -o pipefail
          uv run pytest -n 3 -m "not arcade and not tmux" -q -ra --junitxml=macos-junit.xml 2>&1 | tee macos-pytest.txt
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: macos-fast-tests-report
          path: |
            macos-junit.xml
            macos-pytest.txt
          if-no-files-found: warn
          retention-days: 7

  windows-fast-tests:
    # The fast tier on native Windows (Python 3.12+). Bounded so a hang cannot burn runner minutes;
    # the pytest output and JUnit XML are kept as an artifact.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests
      - name: Fast tier
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Continue"
          uv run pytest -n 4 -m "not arcade and not tmux" -q -ra --junitxml=windows-junit.xml 2>&1 | Tee-Object -FilePath windows-pytest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: windows-fast-tests-report
          path: |
            windows-junit.xml
            windows-pytest.txt
          if-no-files-found: warn
          retention-days: 7

  windows-arcade-tests:
    # Real pinned ArcadeDB on Java 21 on native Windows (excluding tmux-only modules), sharded in 4 parts.
    name: windows-arcade-tests (${{ matrix.shard }} of 4)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - uses: actions/cache@v6
        with:
          path: ~/.cache/devbrain-arcade
          key: arcadedb-windows-${{ hashFiles('src/cairnmind/config.py') }}
      - name: Prepare pinned ArcadeDB
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from cairnmind.config import Settings
          from cairnmind.engine import install_engine
          settings = Settings.load(Path.home() / ".cache/devbrain-arcade", create=True)
          path = install_engine(settings)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"CAIRNMIND_ARCADE_DIST={path}\n")
          '@ | uv run python -
      - name: ArcadeDB tier
        shell: pwsh
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = "Continue"
          uv run pytest -n 4 -m "arcade and not tmux" -q -ra --shard ${{ matrix.shard }}/4 --junitxml=windows-arcade-junit.xml 2>&1 | Tee-Object -FilePath windows-arcade-pytest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: windows-arcade-tests-report-${{ matrix.shard }}
          path: |
            windows-arcade-junit.xml
            windows-arcade-pytest.txt
          if-no-files-found: warn
          retention-days: 7

  tests:
    # The whole suite in four parts that run at the same time, each on a runner of its own: real pinned
    # ArcadeDB on Java 21 plus tmux, as on the target WSL host. `--shard I/4` picks a part by test id
    # (tests/conftest.py); the parts are disjoint and together are the whole suite (tests/test_shards.py).
    name: tests (${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - uses: actions/cache@v6
        with:
          path: ~/.cache/devbrain-arcade
          key: arcadedb-${{ hashFiles('src/cairnmind/config.py') }}
      - name: Prepare pinned ArcadeDB
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from cairnmind.config import Settings
          from cairnmind.engine import install_engine
          settings = Settings.load(Path.home() / ".cache/devbrain-arcade", create=True)
          path = install_engine(settings)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CAIRNMIND_ARCADE_DIST={path}\n")
          PY
      # The standard Linux runner of a public repository has 4 vCPUs: one test process for each,
      # all sharing one ArcadeDB engine (see tests/conftest.py). No coverage here: this decides the
      # required check, and a hiccup of coverage's tracer must never decide a merge.
      - run: uv run pytest -n 4 -q --shard ${{ matrix.shard }}/4

  full-tests:
    # The required check. It passes only when every part of `tests` passed; it always runs, because a
    # skipped required check would count as passed.
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every part of the suite passed
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "tests: $RESULT"
          test "$RESULT" = success

  coverage-tests:
    # The same four parts with coverage, beside `tests`. Each part keeps its coverage data as an
    # artifact; `coverage` below combines them. Not required.
    name: coverage tests (${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - uses: actions/cache@v6
        with:
          path: ~/.cache/devbrain-arcade
          key: arcadedb-${{ hashFiles('src/cairnmind/config.py') }}
      - name: Prepare pinned ArcadeDB
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from cairnmind.config import Settings
          from cairnmind.engine import install_engine
          settings = Settings.load(Path.home() / ".cache/devbrain-arcade", create=True)
          path = install_engine(settings)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CAIRNMIND_ARCADE_DIST={path}\n")
          PY
      # Branch coverage of src/cairnmind; the data of the workers and of the processes the tests
      # start is combined into one file per part.
      - run: uv run pytest -n 4 -q --cov --cov-report= --shard ${{ matrix.shard }}/4
        env:
          COVERAGE_FILE: .coverage.part${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-part-${{ matrix.shard }}
          path: .coverage.part${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

  coverage:
    # Coverage of the whole suite, combined from the four parts. Not a required check: it may go red
    # without blocking anything. Reported in the log and the job summary; on a push to main its
    # `badge` output goes to coverage-badge, which publishes it to the public `badges` branch for the
    # README badge. No threshold fails the job.
    needs: coverage-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      badge: ${{ steps.summary.outputs.badge }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Patch coverage needs the merge base with the pull request's target branch; a pull request
          # checks out its merge commit at depth 1 by default, which has no history to find it in.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-part-*
          merge-multiple: true
      - name: Combine the parts
        run: |
          ls -la .coverage.part* || true
          uv run coverage combine --keep .coverage.part*
          uv run coverage xml
      - name: Coverage summary
        id: summary
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          TESTS: ${{ needs.coverage-tests.result }}
        # Still reported when tests failed, marked as numbers from a run with failures.
        run: |
          set -- --no-patch
          if [ "$EVENT" = pull_request ]; then set -- --compare-branch "origin/$BASE_REF"; fi
          if [ "$TESTS" != success ]; then set -- "$@" --tests-failed; fi
          uv run python scripts/coverage_summary.py "$@"
      - name: Every part of the suite passed under coverage
        # A run with failures fails this job, so its number never reaches the badge.
        env:
          TESTS: ${{ needs.coverage-tests.result }}
        run: test "$TESTS" = success

  deployment-image:
    # The database container of docs/DEPLOYMENT.md, beside the other jobs and not a required check,
    # like coverage. Builds deploy/arcadedb at the pinned ArcadeDB version, starts two copies of
    # deploy/compose.yaml on loopback ports, and with the cairnmind CLI checks that each answers,
    # then backs one up and restores it into the other. Both are removed with their volumes at the end.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - run: docker version && docker compose version
      - run: uv run python scripts/deployment_check.py

  server-tests:
    # The engine tests against a server this job does not own (#218), beside the other jobs and not a
    # required check, like deployment-image: nothing needs it, and `full-tests` above does not wait for it.
    # It pulls the published database image by the digest pinned in src/cairnmind/config.py (no sign-in, no
    # secret), starts it in production mode on a free loopback port with a random root password file, and runs
    # the tests marked `arcade` in server mode (tests/conftest.py): nothing is installed or started by the
    # tests, which connect as a connect-only installation would. The tests left out, each with its reason, are
    # in the job summary. Not on pull requests: a run has not been timed against a production-mode server,
    # where every commit reaches the disk, and a long job on every push of a branch costs runner time for
    # little. It runs on main and by hand (`gh workflow run ci.yml --ref BRANCH`), so a change to the tests or
    # to deploy/arcadedb can be tried before it is merged.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y tmux
      # Java 21 as in the tests job: tests that set up a managed installation of their own (a backup, a move to a
      # connect-only store and back) need it, and the pinned image runs the server, not those.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - name: Start the pinned image
        run: |
          image=$(uv run python -c "from cairnmind import config; print(f'{config.ARCADE_IMAGE}@{config.ARCADE_IMAGE_DIGEST}')")
          port=$(uv run python -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1])")
          (umask 077; openssl rand -hex 24 > "$RUNNER_TEMP/root-password")
          docker run -d --name cairnmind-server-tests -p "127.0.0.1:$port:2480" \
            -v "$RUNNER_TEMP/root-password:/run/secrets/arcadedb_root_password:ro" "$image"
          for _ in $(seq 60); do
            test "$(docker inspect -f '{{.State.Health.Status}}' cairnmind-server-tests)" = healthy && break
            sleep 3
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' cairnmind-server-tests)" = healthy
          echo "CAIRNMIND_TEST_ARCADE_SERVER_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          echo "CAIRNMIND_TEST_ARCADE_SERVER_PASSWORD_FILE=$RUNNER_TEMP/root-password" >> "$GITHUB_ENV"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Say what is tested and what is left out
        shell: bash  # with pipefail: a failing import must not leave an empty list over a green step
        run: |
          {
            echo "Engine tests against \`$IMAGE\`, production mode, connect-only. Left out, with the reason:"
            echo
            uv run python -c "import sys; sys.path.insert(0, 'tests'); from conftest import LEFT_OUT_ON_A_SERVER as t; [print(f'- \`{k}\`: {v}') for k, v in t.items()]"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: uv run pytest -n 4 -q -rs -m arcade
      - name: The server's log
        if: ${{ always() }}
        run: docker logs --tail 200 cairnmind-server-tests
      - name: Remove the server
        if: ${{ always() }}
        run: docker rm -f -v cairnmind-server-tests

  restore-size:
    # The one test of tests/test_restore_size.py (#362): a store of this repository's size restored on an engine of its
    # own with the default heap of 1 GB, and again through a delayed link, about 6 to 7 minutes. Marked `slow_size`,
    # which no other job and no plain `pytest` run selects. Not a required check and nothing waits for it, like
    # server-tests; on main and by hand (`gh workflow run ci.yml --ref BRANCH`), not on pull requests. The seconds
    # and the engine's largest resident memory go to the job summary.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - uses: actions/cache@v6
        with:
          path: ~/.cache/devbrain-arcade
          key: arcadedb-${{ hashFiles('src/cairnmind/config.py') }}
      - name: Prepare pinned ArcadeDB
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from cairnmind.config import Settings
          from cairnmind.engine import install_engine
          settings = Settings.load(Path.home() / ".cache/devbrain-arcade", create=True)
          path = install_engine(settings)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CAIRNMIND_ARCADE_DIST={path}\n")
          PY
      - run: uv run pytest -q -s -m slow_size tests/test_restore_size.py

  coverage-badge:
    # Publishes the total line coverage for the README badge, after a push to main only: never for a
    # pull request, so no pull request (from a fork or not) can write here. Not a required check.
    # The only thing it writes is coverage.json on the orphan branch `badges` (one commit, replaced
    # each time). The repository is public, and that public JSON file is the only thing shields.io
    # fetches to draw the badge; nothing else leaves GitHub Actions.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # One publication at a time, so that the check of main's tip below and the push stay together.
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - name: Publish coverage.json to the badges branch
        env:
          BADGE: ${{ needs.coverage.outputs.badge }}
          TOKEN: ${{ github.token }}
        run: |
          test -n "$BADGE"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A re-run of an older push must not replace the badge of a newer main with its number.
          tip=$(git ls-remote "$remote" refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "main is at $tip now, not at $GITHUB_SHA: the badge is left as it is."
            exit 0
          fi
          mkdir badge && cd badge
          git init -q -b badges
          printf '%s\n' "$BADGE" > coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Coverage of $GITHUB_SHA"
          git push -q --force "$remote" HEAD:refs/heads/badges

  kubernetes-manifests:
    # The Kubernetes manifests of docs/DEPLOYMENT.md, beside the other jobs and not a required check,
    # like deployment-image. On a kind cluster of the runner: every manifest under deploy/kubernetes is
    # checked against the cluster's schemas (server-side dry run, strict validation), then applied, and
    # the documented connection check runs as a Job with the passwords mounted from Secrets and again
    # through kubectl port-forward. See scripts/kubernetes_check.py.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KIND_VERSION: v0.27.0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - name: kind and kubectl
        # Both are on the hosted runner image; kind is fetched, and checked against the SHA-256 its
        # release publishes, only when it is missing.
        run: |
          if ! command -v kind >/dev/null; then
            base="https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION"
            curl -fsSL --retry 3 -o kind "$base/kind-linux-amd64"
            curl -fsSL --retry 3 -o kind.sha256 "$base/kind-linux-amd64.sha256sum"
            echo "$(awk '{print $1}' kind.sha256)  kind" | sha256sum -c -
            sudo install -m 0755 kind /usr/local/bin/kind
          fi
          docker version && kind version && kubectl version --client
      - run: kind create cluster --name cairnmind-check --wait 180s
      - run: uv run python scripts/kubernetes_check.py --kind-cluster cairnmind-check
      - if: ${{ always() }}
        run: kind delete cluster --name cairnmind-check
